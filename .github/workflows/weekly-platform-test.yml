name: Weekly Platform Test

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight UTC
  workflow_dispatch:

jobs:
  run-behat-tests:
    name: Run Behat Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      # Every run prepares and tears down the same `behat` multidev, so the
      # versions must run one at a time or they will trample each other.
      max-parallel: 1
      fail-fast: false
      matrix:
        # Only versions that still receive upstream support (8.1 and older are EOL).
        php: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          tools: composer

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Configure Pantheon Host Key
        run: |
          echo "Host *.drush.in HostKeyAlgorithms +ssh-rsa" >> ~/.ssh/config
          echo "Host *.drush.in PubkeyAcceptedKeyTypes +ssh-rsa" >> ~/.ssh/config
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Install Terminus
        uses: pantheon-systems/terminus-github-actions@v1
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_TOKEN }}

      - name: Install Terminus Secrets Plugin
        run: terminus self:plugin:install pantheon-systems/terminus-secrets-manager-plugin

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Behat tests
        run: composer test